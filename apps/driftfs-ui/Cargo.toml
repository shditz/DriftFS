[package]
name = "driftfs-ui"
description = "Desktop application and system tray management surface for DriftFS."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "driftfs-ui"
path = "src/main.rs"

[dependencies]
driftfs-core = { workspace = true }
driftfs-config = { workspace = true }
driftfs-logging = { workspace = true }
driftfs-auth = { workspace = true }
driftfs-provider = { workspace = true }
driftfs-google-drive = { workspace = true }
driftfs-metadata = { workspace = true }
driftfs-filesystem = { workspace = true }
driftfs-sync = { workspace = true }
driftfs-cache = { workspace = true }

[target.'cfg(windows)'.dependencies]
driftfs-platform-windows = { workspace = true }
windows-sys = { version = "0.52.0", features = ["Win32_System_Threading", "Win32_Foundation"] }

tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
slint = { workspace = true }
tray-icon = { workspace = true }
open = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
embed-resource = "3"

[lints]
workspace = true
