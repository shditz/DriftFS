name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-windows:
    name: Check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install WinFsp
        shell: pwsh
        run: |
          choco install winfsp --no-progress -y
          if (-not (Test-Path "HKLM:\SOFTWARE\WOW6432Node\WinFsp")) {
            New-Item -Path "HKLM:\SOFTWARE\WOW6432Node\WinFsp" -Force | Out-Null
          }
          Set-ItemProperty -Path "HKLM:\SOFTWARE\WOW6432Node\WinFsp" -Name "InstallDir" -Value "C:\Program Files (x86)\WinFsp\"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all

  check-linux:
    name: Check (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Check Core & Platform Scaffolding
        run: |
          cargo check -p driftfs-core -p driftfs-config -p driftfs-logging -p driftfs-provider -p driftfs-auth -p driftfs-metadata -p driftfs-sync -p driftfs-cache -p driftfs-filesystem -p driftfs-google-drive -p driftfs-testkit -p driftfs-platform-linux

      - name: Test Core & Platform Scaffolding
        run: |
          cargo test -p driftfs-core -p driftfs-config -p driftfs-logging -p driftfs-provider -p driftfs-auth -p driftfs-metadata -p driftfs-sync -p driftfs-cache -p driftfs-filesystem -p driftfs-google-drive -p driftfs-testkit -p driftfs-platform-linux

  check-macos:
    name: Check (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check Core & Platform Scaffolding
        run: |
          cargo check -p driftfs-core -p driftfs-config -p driftfs-logging -p driftfs-provider -p driftfs-auth -p driftfs-metadata -p driftfs-sync -p driftfs-cache -p driftfs-filesystem -p driftfs-google-drive -p driftfs-testkit -p driftfs-platform-macos

      - name: Test Core & Platform Scaffolding
        run: |
          cargo test -p driftfs-core -p driftfs-config -p driftfs-logging -p driftfs-provider -p driftfs-auth -p driftfs-metadata -p driftfs-sync -p driftfs-cache -p driftfs-filesystem -p driftfs-google-drive -p driftfs-testkit -p driftfs-platform-macos
